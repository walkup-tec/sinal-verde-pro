# Evita pausa automática do Supabase Free (inatividade ~7 dias).
# Doc: https://supabase.com/docs/guides/platform/free-project-pausing
#
# Secret obrigatório (GitHub → Settings → Secrets → Actions):
#   DATABASE_URL — mesma URI pooler do Easypanel (.env.easypanel)

name: Supabase keepalive

on:
  schedule:
    # Segunda e quinta 12:00 UTC (~9h BRT) — margem segura abaixo de 7 dias
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL ausente nos secrets do repositório."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Ping Supabase (insert + delete)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/supabase-keepalive.mjs
